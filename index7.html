<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<style>
    #box{
        width: 100px;
        height: 100px;
        margin: 25%;
        background-color: rgb(11, 70, 171);
        transition-duration: 7s;
        transition-property: width;
        transition-timing-function: ease;
        transition-delay: 0s;
        margin: auto;
        transition: width 6s ease-in-out 0.3s;
        border-radius: 10px;

    }
    #box:hover{
        width: 400px;
        transition-delay: 0s;
        height: 400px;
    }
</style>
<body>
    <div id="box">
        

    </div>
    
    
</body>
</html>
